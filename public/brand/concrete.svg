<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- rough plaster/concrete: fine grit over soft mottling, tinted brown, tiles seamlessly -->
  <filter id="grit" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="4" stitchTiles="stitch" result="n" />
    <feColorMatrix type="matrix" values="0 0 0 0 0.26  0 0 0 0 0.13  0 0 0 0 0.02  0 0 0 -1.6 1.02" />
  </filter>
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="9" stitchTiles="stitch" />
    <feColorMatrix type="matrix" values="0 0 0 0 0.26  0 0 0 0 0.13  0 0 0 0 0.02  0 0 0 -2.4 1.5" />
  </filter>
  <filter id="pits" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="turbulence" baseFrequency="0.22" numOctaves="1" seed="17" stitchTiles="stitch" />
    <feColorMatrix type="matrix" values="0 0 0 0 0.26  0 0 0 0 0.13  0 0 0 0 0.02  0 0 0 -9 6.4" />
  </filter>
  <rect width="480" height="480" filter="url(#mottle)" opacity="0.035" />
  <rect width="480" height="480" filter="url(#grit)" opacity="0.15" />
  <rect width="480" height="480" filter="url(#pits)" opacity="0.12" />
</svg>
